# Copy or symlink to ~/.tmux.conf. The prefix is Ctrl-b.

# Session defaults
set -g default-terminal 'tmux-256color'
set -sg escape-time 25
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
set -wg pane-base-index 1
set -g renumber-windows on
set -wg mode-keys vi

# After Ctrl-b, use arrows to select panes and n/p to cycle through windows.
bind-key -r Left select-pane -L
bind-key -r Right select-pane -R
bind-key -r Up select-pane -U
bind-key -r Down select-pane -D
bind-key n next-window
bind-key p previous-window

# Start new windows and splits in the current pane's directory.
bind-key c new-window -c '#{pane_current_path}'
bind-key '|' split-window -h -c '#{pane_current_path}'
bind-key '-' split-window -v -c '#{pane_current_path}'
bind-key r source-file ~/.tmux.conf \; display-message 'Reloaded ~/.tmux.conf'

# Match the Nord-inspired colors in .vimrc using the 256-color palette.
set -g status-style 'bg=colour236,fg=colour253'
set -g status-left-length 24
set -g status-left '#[bg=colour116,fg=colour236,bold] #S #[default] '

# Show the active pane's Git checkout, with a short commit ID on detached HEAD.
# Escape printf's percent signs and keep hashes in Git names literal.
set -g status-right-length 60
set -g status-right '#{=/38/…:#(\
    cd #{q:pane_current_path} 2>/dev/null && \
    repo=$(git rev-parse --show-toplevel 2>/dev/null) && \
    branch=$(git symbolic-ref --quiet --short HEAD 2>/dev/null || \
        git rev-parse --short HEAD 2>/dev/null) && \
    printf "%%%%s · %%%%s" "$(basename -- "$repo")" "$branch" | \
        sed "s/#/########/g"\
)}  #[fg=colour116] %a %b %d  %H:%M '

set -wg window-status-format ' #I:#W#F '
set -wg window-status-current-style 'bg=colour238,fg=colour116,bold'
set -wg window-status-current-format ' #I:#W#F '
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=colour116'
set -g message-style 'bg=colour238,fg=colour253'
set -wg mode-style 'bg=colour116,fg=colour236'
